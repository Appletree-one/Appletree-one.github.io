<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="自己設計的 19 隻怪獸打怪遊戲，可以一個人玩、兩人合作或雙人對戰。">
<title>吉吉大冒險</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&text=%E5%90%89%E5%A4%A7%E5%86%92%E9%9A%AA&display=swap">
<style>
/* layout: one battle arena card, monsters on a sunny field, big tap buttons under it */
:root{
  --sky:#bfe6ff; --field:#9ed36a; --field-dark:#6fae3e;
  --ink:#2b2118; --paper:#fffaf0; --fire:#f0612b; --fire-dark:#b33a14;
  --aura:#3f7ff0; --aura-dark:#22489c; --grass:#3f8a2e; --hp:#4cc65a; --hp-low:#e8443a;
  --page:#fff3dc;
  --font-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font-display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{width:min(100%,1000px,calc((100dvh - 24px) * 0.68));margin:0 auto;display:flex;flex-direction:column;gap:clamp(8px,1.5vw,16px)}
.top{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.fs{font-family:inherit;font-size:clamp(13px,1.8vw,18px);background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:4px 10px;cursor:pointer}
h1{margin:0;text-align:center;font-family:"Noto Sans TC",var(--font-display);font-weight:900;font-size:clamp(36px,6.5vw,66px);line-height:1.15;letter-spacing:.02em;display:flex;gap:.07em;padding-bottom:.12em}
h1 .lg{display:inline-block;color:#fff;--o:#2b2118;
  text-shadow:.06em 0 var(--o),-.06em 0 var(--o),0 .06em var(--o),0 -.06em var(--o),.045em .045em var(--o),-.045em .045em var(--o),.045em -.045em var(--o),-.045em -.045em var(--o),0 .13em 0 var(--d,#f0612b),.05em .13em 0 var(--o),-.05em .13em 0 var(--o),0 .19em 0 var(--o)}
h1 .lg.j{color:#ffc83d;--d:#d9401c;animation:bob 1.6s ease-in-out infinite}
h1 .lg.j+.lg.j{animation-delay:.25s}
h1 .lg:nth-child(odd){transform:rotate(-6deg)}h1 .lg:nth-child(even){transform:rotate(5deg) translateY(.04em)}
h1 .lg.j:nth-child(1){transform:rotate(-8deg)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -.08em}}
@media (prefers-reduced-motion:reduce){h1 .lg.j{animation:none}}
.arena{position:relative;aspect-ratio:1/0.95;max-width:100%;border:4px solid var(--ink);border-radius:18px;overflow:hidden;
  background:linear-gradient(var(--sky) 0 52%,var(--field) 52% 100%)}
.pad{position:absolute;border-radius:50%;background:var(--field-dark)}
.pad.boss{width:46%;height:10%;right:4%;top:44%}
.pad.me{width:50%;height:11%;left:2%;bottom:6%}
.mon{position:absolute;transition:transform .2s}
.mon svg{width:100%;height:100%;display:block}
#boss{width:42%;height:38%;right:5%;top:8%}
#boss svg{transform:scaleX(-1)}
#me{width:40%;height:40%;left:6%;bottom:10%}
#me2{width:30%;height:32%;left:36%;bottom:3%}
.hpbox{position:absolute;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;min-width:0;width:44%}
.hpbox.boss{left:4%;top:5%}
.hpbox.me{right:4%;bottom:12%}
.coop .hpbox.me{width:33%;right:2%;bottom:30%}.coop .hpbox.me2{width:33%;right:2%;bottom:4%}
.hpbox .pn{display:none;font-size:.7em;background:var(--ink);color:#fff;border-radius:6px;padding:0 6px;margin-right:4px}
.coop .hpbox.pl .pn,.pvp .hpbox .pn{display:inline-block}
.pvp .hpbox.turn{outline:5px solid #f0612b;outline-offset:2px}
.coop .hpbox.turn{outline:5px solid #f0612b;outline-offset:2px}
.hpbox .name{font-size:clamp(15px,2.6vw,26px);display:flex;justify-content:space-between;gap:6px}
.hpbox .type{font-size:clamp(12px,1.8vw,18px);color:#fff;border-radius:6px;padding:0 6px}
.bar{height:clamp(12px,1.8vw,20px);border:2px solid var(--ink);border-radius:8px;background:#e9e2d4;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--hp);transition:width .6s,background .3s}
.num{font-size:clamp(13px,2vw,20px);text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.msg{background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:clamp(10px,1.8vw,18px) clamp(12px,2vw,22px);font-size:clamp(18px,3vw,30px);min-height:2.2em;line-height:1.5}
.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.5vw,16px)}
.mv{font-family:inherit;font-size:clamp(18px,3.2vw,32px);min-width:0;color:#fff;border:4px solid var(--ink);border-radius:14px;padding:12px 6px;cursor:pointer;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.mv small{display:block;font-size:clamp(12px,1.8vw,18px);opacity:.95;margin-top:2px}
.mv:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mv:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
.mv:focus-visible{outline:4px solid var(--aura);outline-offset:3px}
.mv.aura{background:var(--aura)}
.mv.fire{background:var(--fire)}
.mv.guard{background:#8a6cd8}
.shield{position:absolute;inset:-6%;border:6px solid #8a6cd8;border-radius:50%;background:rgba(138,108,216,.18);pointer-events:none}
.shot{position:absolute;border-radius:50%;pointer-events:none;z-index:5}
.shot.aura{width:14%;aspect-ratio:1;background:radial-gradient(#fff 0 25%,#8fb8ff 30%,var(--aura) 70%);border:3px solid var(--aura-dark)}
.shot.fire{width:22%;aspect-ratio:1;background:radial-gradient(#fff07a 0 25%,#ffb23d 45%,var(--fire) 75%);border:3px solid var(--fire-dark)}
.shot.vine{width:12%;aspect-ratio:1;background:radial-gradient(#c8e89a 0 30%,var(--grass) 75%);border:3px solid #24521f}
.boom{position:absolute;font-size:44px;z-index:6;pointer-events:none;animation:boom .6s forwards}
@keyframes boom{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.hit{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.blink{animation:blink .5s 2}
@keyframes blink{50%{opacity:.2}}
.faint{transform:translateY(30%) scale(.7)!important;opacity:0;transition:all .8s}
.end{position:absolute;inset:0;background:rgba(43,33,24,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.end .card{background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:18px;text-align:center;max-width:90%}
.end h2{margin:0 0 6px;font-size:30px}
.end p{margin:0 0 14px;font-size:17px}
.again{font-family:inherit;font-size:20px;background:var(--fire);color:#fff;border:4px solid var(--ink);border-radius:14px;padding:10px 22px;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.tip{font-size:clamp(13px,1.9vw,19px);text-align:center;opacity:.75;margin:0}
@media (prefers-reduced-motion:reduce){.hit,.blink,.boom{animation:none}}
.mv.volt{background:#f2b72f;color:var(--ink)}
.shot.volt{width:16%;aspect-ratio:1;background:radial-gradient(#fff 0 25%,#ffe14a 45%,#f2b72f 75%);border:3px solid #a8760a}
.rps{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.5vw,16px)}
.rb{font-family:inherit;font-size:clamp(40px,8vw,80px);line-height:1.1;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:8px 4px;cursor:pointer;box-shadow:0 5px 0 var(--ink);min-width:0}
.rb small{display:block;font-size:clamp(16px,2.6vw,26px)}
.rb.sel{background:#ffe08a;transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.rb:focus-visible{outline:4px solid var(--aura);outline-offset:3px}
.cd{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(255,250,240,.72);text-align:center;padding:16px}
.cd .big{font-size:clamp(80px,18vw,180px);color:var(--fire);animation:pop .5s}
.cd .vs{font-size:clamp(28px,6vw,60px)}
.cd .res{font-size:clamp(30px,6.5vw,64px);color:var(--fire)}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.moves{grid-template-columns:repeat(var(--cols,3),1fr)}
.mv.vine{background:#3f8a2e}.mv.leaf{background:#7cc443;color:var(--ink)}.mv.heal{background:#f28a1e;color:var(--ink)}
.shot.leaf{width:13%;aspect-ratio:1;border-radius:0 70% 0 70%;background:#8fd65a;border:3px solid #2e6b1c}
.select{display:flex;flex-direction:column;gap:clamp(10px,2vw,20px)}
.select h2{margin:0;text-align:center;font-size:clamp(22px,4vw,40px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(10px,2vw,20px)}
.pick{font-family:inherit;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:clamp(10px,2vw,20px);cursor:pointer;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pick:focus-visible{outline:4px solid var(--aura);outline-offset:3px}
.pick .art{width:100%;height:clamp(110px,18vw,170px)}.pick .art svg{width:100%;height:100%;display:block}
.pick .nm{font-size:clamp(24px,4.2vw,40px);display:flex;align-items:center;gap:8px}
.pick .type{font-size:clamp(13px,2vw,18px);color:#fff;border-radius:6px;padding:0 8px}
.pick ul{list-style:none;margin:0;padding:0;font-size:clamp(14px,2.2vw,20px);line-height:1.6}
.pick .go{margin-top:4px;font-size:clamp(16px,2.6vw,24px);background:var(--fire);color:#fff;border-radius:10px;padding:4px 14px}
.endbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.again.alt{background:var(--paper);color:var(--ink)}
#boss.noflip svg{transform:none}
.shot.drain{width:13%;aspect-ratio:1;background:radial-gradient(#ffd0da 0 25%,#e0405a 70%);border:3px solid #7a1424}
.shot.bat{width:15%;aspect-ratio:1;background:radial-gradient(#b9a3e0 0 25%,#4a2d7a 70%);border:3px solid #22113d}
.coin{width:clamp(110px,24vw,220px);aspect-ratio:1;border-radius:50%;background:#f2c230;border:6px solid #a8760a;display:flex;align-items:center;justify-content:center;font-size:clamp(56px,12vw,110px);box-shadow:inset 0 0 0 8px #ffdc63}
.mv.itemb{background:#f2c230;color:var(--ink)}.mv.itemb.on{background:#fff07a}
.mv.soup{background:#b3203a}
.pick.cont{font-size:clamp(18px,3.2vw,30px);background:#fff07a;padding:clamp(12px,2vw,20px)}
.pick .evo{font-size:clamp(14px,2.2vw,20px);background:#fff07a;border:2px solid var(--ink);border-radius:10px;padding:4px 10px}.mv.wing{background:#d9401c}.mv.slash{background:#a8520a}
#me.big{width:44%;height:44%;left:4%}
.coop #me{width:30%;height:32%;left:3%;bottom:12%}.coop #me.big{width:33%;height:35%;left:2%}.coop #me.big2{width:36%;height:38%;left:0}
.coop #me2.big{width:33%;height:35%;left:34%}.coop #me2.big2{width:36%;height:38%;left:32%}
#me.big2{width:48%;height:48%;left:2%}
.mv.meteor{background:#8a2a0c}.mv.cannon{background:#c96a12}.mv.forest{background:#2e7d3a}
.shot.pumpkin{width:20%;aspect-ratio:1;background:radial-gradient(#ffd08a 0 25%,#f28a1e 60%,#a8520a 85%);border:3px solid #5a2a06}
.shot.slash{width:20%;aspect-ratio:1;border-radius:50%;background:transparent;border:0;border-right:10px solid #f28a1e;border-top:4px solid #ffd23d}
.evo-flash{animation:evo .3s 6 alternate}
@keyframes evo{to{filter:brightness(4) saturate(0)}}
.rps.quizp{grid-template-columns:1fr}
.qb{font-size:clamp(20px,3.4vw,32px)!important;padding:12px!important}
.qb.right{background:#bff0b8}.qb.wrong{background:#ffc2bd}
.dizzy .qb{animation:dizzy 1.1s infinite ease-in-out alternate}
@keyframes dizzy{from{transform:rotate(-3deg) translateX(-10px)}to{transform:rotate(3deg) translateX(10px)}}
.cd .q{font-size:clamp(22px,4.4vw,42px);max-width:92%;line-height:1.4}
.shot.magic{width:16%;aspect-ratio:1;background:radial-gradient(#ffd6f5 0 25%,#b04ad8 55%,#5a1a8a 80%);border:3px solid #3a0d5c}
.cardrow{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.4vw,14px)}
.card{aspect-ratio:2/3;font-family:inherit;font-size:clamp(28px,6vw,64px);border:4px solid var(--ink);border-radius:12px;background:repeating-linear-gradient(45deg,#7a3fb8 0 10px,#9a5fd8 10px 20px);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink);min-width:0;padding:0}
.card:focus-visible{outline:4px solid var(--aura);outline-offset:3px}
.card.open{background:var(--paper);color:var(--ink);animation:cardflip .4s}
.card.pick1{background:#fff07a;transform:translateY(-8px)}
.card.dim{opacity:.5}
@keyframes cardflip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.shot.blade{width:26%;height:5%;border-radius:4px;background:#e6eef7;border:3px solid #4a5a70}
.bossban{display:flex;align-items:center;gap:clamp(10px,2vw,20px);background:#2b1630;color:#fff1e6;box-shadow:0 0 0 4px #a4231a inset;border:4px solid var(--ink);border-radius:18px;padding:clamp(10px,2vw,18px)}
.bossban .art{width:clamp(110px,30%,220px);height:clamp(110px,22vw,200px);flex:none}.bossban .art svg{width:100%;height:100%;display:block}
.bossban .info{min-width:0;font-size:clamp(15px,2.4vw,22px);line-height:1.5}
.bossban .bn{font-size:clamp(22px,4vw,38px);color:#ff9a7a}
.bossban .art{background:#4a2550;border-radius:12px;padding:6px}
.bossban .type{white-space:nowrap;display:inline-block;color:#fff;border-radius:6px;padding:0 8px;font-size:.7em}
.stars{font-size:clamp(16px,2.6vw,24px);letter-spacing:2px}
[hidden]{display:none!important}
#game{display:flex;flex-direction:column;gap:clamp(8px,1.5vw,16px)}
@media (orientation:landscape) and (min-width:700px) and (min-height:480px){
  .wrap{width:min(100%,1400px);gap:10px}
  h1{font-size:clamp(32px,4.2vw,54px)}
  #game:not([hidden]){display:grid;grid-template-columns:min(58%,calc((100dvh - 100px) / 0.95)) 1fr;column-gap:clamp(12px,2vw,24px);row-gap:10px;align-items:start;align-content:start}
  #game>.arena{grid-column:1;grid-row:1 / span 8}
  #game>:not(.arena){grid-column:2;min-width:0}
  .msg{font-size:clamp(17px,2vw,26px)}
  .mv{font-size:clamp(16px,1.9vw,24px)}
  .mv small{font-size:clamp(12px,1.3vw,16px)}
  .rb{font-size:clamp(36px,4.5vw,60px)}
  .rb small{font-size:clamp(15px,1.8vw,22px)}
  .qb{font-size:clamp(17px,2vw,26px)!important}
  .card{font-size:clamp(24px,3vw,42px)}
  .tip{font-size:clamp(12px,1.3vw,16px)}
  .cd .q{font-size:clamp(20px,2.8vw,36px)}
  .select:not([hidden]){display:grid;grid-template-columns:minmax(220px,32%) 1fr;column-gap:clamp(12px,2vw,24px);row-gap:10px;align-items:start}
  .select>.bossban{grid-column:1;grid-row:1 / span 5;flex-direction:column;text-align:center}
  .select>:not(.bossban){grid-column:2;min-width:0}
  .bossban .art{width:80%;height:clamp(150px,30vh,250px)}
  .pick .art{height:clamp(100px,15vh,150px)}
  .pick{gap:4px;padding:10px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}
  .pick .nm{font-size:clamp(18px,2.1vw,28px);flex-wrap:wrap;justify-content:center}
  .pick ul{font-size:clamp(13px,1.5vw,18px);line-height:1.45}
}
.shell{position:relative;height:clamp(110px,16vw,170px);margin-top:clamp(40px,7vw,80px)}
.cup{position:absolute;bottom:0;width:30%;height:100%;padding:0;border:0;background:none;cursor:pointer;z-index:1;transition-property:left,transform;transition-timing-function:ease-in-out;transition-duration:.45s}
.cup svg{width:100%;height:100%;display:block}
.cup:focus-visible{outline:4px solid var(--aura);outline-offset:3px;border-radius:12px}
.cup.up{transform:translateY(-55%)}
.ball{position:absolute;bottom:3%;width:12%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 12%,#ffcc33 40%,#e08a00 80%);border:3px solid #7a4a00;z-index:0;transition:opacity .2s}
.home{display:flex;flex-direction:column;gap:clamp(10px,1.8vw,18px)}
.home h2{margin:0;text-align:center;font-size:clamp(22px,4vw,40px)}
.sec{font-size:clamp(17px,2.6vw,24px)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.opt{font-family:inherit;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:8px;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:clamp(14px,2vw,19px);min-width:0;text-align:center}
.opt .art{width:100%;height:clamp(70px,11vw,110px)}.opt .art svg{width:100%;height:100%;display:block}
.opt .bigi{font-size:clamp(32px,5.5vw,52px);line-height:1.2}
.opt.bo{background:#2b1630;color:#fff1e6}
.opt.on{background:#fff07a;color:var(--ink);transform:translateY(3px);box-shadow:0 1px 0 var(--ink);outline:4px solid #f0612b;outline-offset:2px}
.opt:focus-visible{outline:4px solid var(--aura);outline-offset:3px}
#go{align-self:center;font-size:clamp(22px,3.6vw,34px);padding:10px 48px}
.dark>svg:not(.ov){filter:brightness(.5) saturate(1.5) hue-rotate(-15deg) drop-shadow(0 0 6px #c040ff) drop-shadow(0 0 14px #7a1fd0)}
.art{position:relative}.mon .ov,.art .ov{position:absolute;inset:0;width:100%;height:100%}
.pm.flip svg,.art.flip svg{transform:scaleX(-1)}
.mv.dark{background:#4a2550}.mv.blue{background:#2f5fb8}
.opt.ph{opacity:.6;cursor:default;border-style:dashed}
.pick button.go{border:0;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.evob{font-family:inherit;font-size:clamp(14px,2.2vw,20px);background:#7a3fb8;color:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 12px;cursor:pointer}
.pick:active{transform:none;box-shadow:0 6px 0 var(--ink)}
.pm.invis svg{opacity:.28;transition:opacity .4s}
.mv.ghostb{background:#3f7fd6}.mv.ghostc{background:#5a5fa8}
.shot.ghostfire{width:14%;aspect-ratio:1;background:radial-gradient(#e6f7ff 0 25%,#7fd4ff 55%,#2a6fb0 85%);border:3px solid #1a4a80}
.mv.wave{background:#2a7fc4}.mv.moon{background:#ffd23d;color:var(--ink)}
.shot.wave{width:18%;aspect-ratio:1;background:radial-gradient(#e6f7ff 0 20%,#7fc6f0 45%,#2a7fc4 75%);border:3px solid #163c73}
.mv.rainbow{background:linear-gradient(90deg,#ff6b8a,#ffb347,#7ad0ff,#9a6bff);color:#fff;text-shadow:0 1px 2px #0006}.mv.star{background:#ffd23d;color:var(--ink)}.mv.bless{background:#ff9ad5;color:var(--ink)}
.shot.rainbow{width:16%;aspect-ratio:1;background:conic-gradient(#ff6b8a,#ffb347,#fff07a,#7ad07a,#7ad0ff,#9a6bff,#ff6b8a);border:3px solid #fff}
.mv.rock{background:#8a6a4a}.mv.crystal{background:#8fd0ff;color:var(--ink)}

function noise(d,v=.2){const a=ac();if(!a||!soundOn)return;const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const src=a.createBufferSource(),g=a.createGain();src.buffer=b;g.gain.value=v;src.connect(g).connect(a.destination);src.start()}

function mathQ(){let a,b,ans,q;
  if(Math.random()<.6){a=rnd(5,60);b=rnd(3,Math.min(39,99-a));ans=a+b;q=a+' + '+b+' = ?'}

  const o=new Set([ans]);for(const x of shuffle([1,-1,10,-10,2,-2])){if(o.size>=3)break;if(ans+x>=0)o.add(ans+x)}
  return {q:'🔢 '+q,a:[String(ans),...[...o].filter(v=>v!==ans).map(String)],math:true}}

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function say(t){$('msg').textContent=t}
function lock(b){S.busy=b;$('itemBtn').disabled=b;btns.forEach((x,i)=>x.disabled=b||S.uses[i]<=0)}
function draw(){
  stash();
  const bars=pvp?P.map(p=>[p.pre,p.hp,p.max]):[['boss',S.boss,S.bossMax],...P.map(p=>[p.pre,p.hp,p.max])];
  for(const [k,v,mx] of bars){
    const pc=Math.max(0,v)/mx*100,bar=$(k+'Bar');
    bar.style.width=pc+'%';bar.style.background=pc<30?'var(--hp-low)':pc<60?'#f2b72f':'var(--hp)';
    $(k+'Num').textContent=Math.max(0,v)+' / '+mx;
  }
  const ib=$('itemBtn');ib.hidden=pvp||!(coins>0||S.lucky)||!$('rps').hidden;ib.classList.toggle('on',!!S.lucky);
  ib.textContent=S.lucky?'🪙 幸運金幣已啟動！這次一定成功':'🪙 使用幸運金幣 ×'+coins;
  C.moves.forEach((m,i)=>{btns[i].querySelector('small').textContent=m.uses?(S.uses[i]>0?m.sub+' 剩 '+S.uses[i]+' 次':'用完了'):m.sub});
}
function center(el){const a=arena.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left-a.left+r.width/2,y:r.top-a.top+r.height/2}}
async function shoot(cls,from,to){sfx('shoot');
  const s=document.createElement('div');s.className='shot '+cls;arena.appendChild(s);
  const f=center(from),t=center(to),w=s.offsetWidth;
  s.style.left=(f.x-w/2)+'px';s.style.top=(f.y-w/2)+'px';
  await s.animate([{transform:'translate(0,0) scale(.6) rotate(0)'},{transform:`translate(${t.x-f.x}px,${t.y-f.y}px) scale(1.2) rotate(360deg)`}],{duration:550,easing:'ease-in'}).finished;
  s.remove();
}
function boom(el,ch){sfx(ch==='🔥'||ch==='☄️'?'fire':'hit');const c=center(el),b=document.createElement('div');b.className='boom';b.textContent=ch;
  b.style.left=(c.x-25)+'px';b.style.top=(c.y-30)+'px';arena.appendChild(b);setTimeout(()=>b.remove(),650)}
function shake(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}

document.querySelectorAll('.rb').forEach(b=>b.onclick=()=>{
  pick=+b.dataset.h;document.querySelectorAll('.rb').forEach(x=>x.classList.toggle('sel',x===b));
  if(rpsWait){const r=rpsWait;rpsWait=null;r()}
});
async function rps(){
  const rb=choices([['⭐','正面'],['🌙','反面']],2);
  $('moves').hidden=true;$('rps').hidden=false;cd.hidden=false;$('itemBtn').hidden=true;
  cd.innerHTML='<div class="coin">?</div>';
  say('猜猜看，硬幣會是⭐正面，還是🌙反面？');
  await new Promise(r=>rpsWait=r);
  rb.forEach(x=>x.disabled=true);
  const FACE=['⭐','🌙'],NAME=['正面','反面'],guess=pick,lucky=S.lucky,res=lucky?guess:rnd(0,1);S.lucky=false;if(lucky)say('幸運金幣在幫你！🪙✨');
  say('你猜'+NAME[guess]+'！硬幣翻呀翻…');
  const coin=cd.querySelector('.coin');coin.textContent='';sfx('flip');
  await coin.animate([{transform:'translateY(0) rotateY(0)'},{transform:'translateY(-35%) rotateY(900deg)',offset:.5},{transform:'translateY(0) rotateY(1800deg)'}],{duration:1500,easing:'ease-in-out'}).finished;
  coin.textContent=FACE[res];
  const r=guess===res?1:2;setTimeout(()=>sfx(r===1?'right':'wrong'),100);
  cd.insertAdjacentHTML('beforeend','<div class="vs">是'+NAME[res]+'！</div><div class="res">'+(r===1?'猜對了！🎉':'猜錯了…')+'</div>');
  await wait(1600);
  cd.hidden=true;$('rps').hidden=true;$('moves').hidden=false;
  draw();return r;
}
async function doMove(m,won){
  if(pvp&&m.dmg){const f=P[1-cur];
    say(C.name+'使出了'+m.name+'！'+m.fx);await wait(400);
    if(P[cur].fogged&&Math.random()<.5){say(C.name+' 在毒霧裡看不清楚，攻擊打歪了！🫧');await wait(1300);return}
    await shoot(m.shot,me,f.el);
    if(f.invis){const g=f.invis==='glide';f.invis=false;f.el.classList.remove('invis','glide');say(g?f.C.name+' 飛到天上，閃過了攻擊！🍃':'攻擊穿過了 '+f.C.name+'！完全打不到！👻');await wait(1400);return}
    boom(f.el,m.fx);shake(f.el);let d=rnd(...m.dmg);if(f.armor)d=Math.round(d*.6);if(P[cur].charge){d*=2;P[cur].charge=false;me.classList.remove('charged')}if(P[cur].weak)d=Math.round(d*.6);let how='';
    if(f.crystal>0){d=Math.ceil(d/5);f.crystal--;if(!f.crystal)f.el.classList.remove('crystal');how='水晶保護擋住了！💎 '}
    else if(f.guard){d=Math.ceil(d/4);how='擋住了！🛡️ '}
    f.hp-=d;draw();say(how+f.C.name+' 受到 '+d+' 點傷害！');
    if(m.drain){const h=Math.min(Math.ceil(d/2),S.meMax-S.me);if(h>0){await wait(1100);S.me+=h;sfx('heal');draw();say(C.name+'吸走了 '+h+' 點體力！💚')}}
    if(m.poison&&f.hp>0&&!f.poison){f.poison=true;await wait(1100);say(f.C.name+' 中毒了！之後每回合都會掉血！☠️')}
    if(m.weak&&f.hp>0){f.weak=true;await wait(1100);say(f.C.name+'被星星魔法包圍，攻擊力變弱了！✨')}
    if(m.bind&&f.hp>0){f.bound=m.bindMsg||'被藤蔓纏住，動不了！🌿';await wait(1100);say(f.C.name+(m.bindMsg||'被藤蔓綁住了！')+' 下一回合要休息！')}
    await wait(1200);return;
  }
  if(m.dmg){
    say(C.name+'使出了'+m.name+'！'+m.fx);await wait(400);
    await shoot(m.shot,me,boss);boom(boss,m.fx);shake(boss);
    let d=rnd(...m.dmg);const cg=P[cur]&&P[cur].charge;if(cg){d*=2;P[cur].charge=false;me.classList.remove('charged')}S.boss-=d;draw();
    say((cg?'集氣爆發！傷害兩倍！！':m.great?'效果絕佳！！':'打中了！')+''+B.name+'受到 '+d+' 點傷害！');
    if(m.drain){const h=Math.min(Math.ceil(d/2),S.meMax-S.me);if(h>0){await wait(1100);S.me+=h;sfx('heal');draw();me.classList.add('blink');say(C.name+'吸走了 '+h+' 點體力！💚');await wait(900);me.classList.remove('blink')}}
    if(m.poison&&!S.poison){S.poison=true;await wait(1100);say(B.name+' 中毒了！之後每回合都會掉血！☠️')}
    if(m.weak){S.weak=true;await wait(1100);say(B.name+'被星星魔法包圍，這一場攻擊力都變弱了！✨')}
    if(m.bind){S.bound=m.bindMsg||'被藤蔓纏住，動不了！🌿';await wait(1200);say(B.name+(m.bindMsg||'被藤蔓綁住了！'))}
  }else if(m.armor){
    P[cur].armor=true;me.classList.add('armored');sfx('guard');say(C.name+' 全身變成超硬的鋼鐵裝甲！這一場受到的傷害都會變少！🛡️⚙️');
  }else if(m.fog){
    sfx('guard');if(pvp){P[1-cur].fogged=true;say(C.name+' 放出紫色毒霧！'+P[1-cur].C.name+' 看不清楚了！🫧')}else{S.fog=true;say(C.name+' 放出紫色毒霧！'+B.name+' 看不清楚，攻擊常常會打歪！🫧')}
  }else if(m.charge){
    P[cur].charge=true;me.classList.add('charged');sfx('evolve');say(C.name+' 深呼吸，集中全身的力量！💪 下一招攻擊會變兩倍！');
  }else if(m.crystal){
    S.crystal=2;me.classList.add('crystal');sfx('guard');say(C.name+' 縮成一顆亮晶晶的水晶球！接下來兩次攻擊都會被擋住！💎');
  }else if(m.invis){
    S.invis=m.glide?'glide':true;me.classList.add(m.glide?'glide':'invis');sfx('guard');say(m.glide?C.name+' 張開翅膀滑翔到天上！下一招攻擊打不到！🍃':C.name+' 變透明了！魔王的下一招會穿過去！👻');
  }else if(m.heal){
    say(C.name+(m.hs||' 喝了一碗熱呼呼的南瓜湯！🎃🥣'));await wait(600);me.classList.add('blink');
    const h=Math.min(rnd(...m.heal),S.meMax-S.me);S.me+=h;sfx('heal');draw();
    await wait(900);me.classList.remove('blink');say((m.hs?'好厲害！':'好喝！')+C.name+' 回復了 '+h+' 點體力！💚');
  }else if(won){
    const h=Math.min(10,S.meMax-S.me);S.me+=h;sfx('heal');draw();me.classList.add('blink');
    say('完美防守！'+C.name+' 回復了 '+h+' 點體力！💚');await wait(1000);me.classList.remove('blink');return;
  }else{say(C.name+' 擺出防守姿勢！🛡️')}
  await wait(1200);
}
async function playerMove(i){
  const m=C.moves[i];
  if(S.busy||S.uses[i]<=0)return;lock(true);
  say('你選了'+m.name+'！'+T('pre'));await wait(800);
  const r=await MODES[MK].run();S.dizzy=false;
  S.uses[i]--;draw();
  if(m.guard){S.guard=true;const sh=document.createElement('div');sh.className='shield';me.appendChild(sh);sfx('guard')}
  if(r!==2){await doMove(m,r===1)}
  else if(m.guard){say(T('fail')+'，但'+C.name+'還是擺出了防守姿勢！🛡️');await wait(1200)}
  else{say((T('fail')+'…')+C.name+'的'+m.name+'沒有成功！');await wait(1300)}
  if(pvp)return pvpAfter();
  if(P.length===1&&!pvp&&S.poison&&S.boss>0){await wait(300);const pd=8;S.boss-=pd;draw();shake(boss);say(B.name+' 毒發了！受到 '+pd+' 點傷害！☠️');await wait(1200)}
  if(S.boss<=0){return win()}
  if(P.length>1){P[cur].res=r;P[cur].done=true;stash();
    const nx=P.findIndex(p=>!p.done&&p.hp>0);
    if(nx>=0){use(nx);draw();say('換 '+tag()+' 出招！');lock(false);return}
    return coopBossPhase()}
  if(r===1){if(!m.guard){say(T('ok')+B.name+'不能攻擊！');await wait(1200)}}
  else if(S.bound){say(B.name+(typeof S.bound==='string'?S.bound:'被藤蔓纏住，動不了！🌿'));await wait(1300)}
  else{await bossMove()}
  S.guard=false;S.bound=false;me.querySelectorAll('.shield').forEach(x=>x.remove());
  if(S.me<=0){return lose()}
  say(C.name+'，要用什麼招式？');lock(false);
}
async function pvpAfter(){
  stash();
  if(P[cur].poison&&P[cur].hp>0){await wait(300);P[cur].hp-=8;S.me=P[cur].hp;draw();shake(me);say(C.name+' 毒發了！受到 8 點傷害！☠️');await wait(1200);
    if(P[cur].hp<=0){const w=1-cur;sfx('win');me.classList.add('faint');setTimeout(()=>{$('change').hidden=false;endScreen('🏆 玩家 '+(w+1)+' 獲勝！',P[w].C.name+' 的毒打敗了 '+C.name+'！好精彩的對戰！','再對戰一次',()=>reset())},900);return}}const f=P[1-cur];
  if(f.hp<=0){sfx('win');f.el.classList.add('faint');say(f.C.name+' 倒下了！');
    setTimeout(()=>{$('change').hidden=false;endScreen('🏆 玩家 '+(cur+1)+' 獲勝！',C.name+' 打敗了 '+f.C.name+'！好精彩的對戰！','再對戰一次',()=>reset())},900);return}
  f.guard=false;f.el.querySelectorAll('.shield').forEach(x=>x.remove());
  let nx=1-cur;
  if(f.bound){say(f.C.name+(typeof f.bound==='string'?f.bound:'動不了！')+' 換 '+C.name+' 再出一次招！');f.bound=false;await wait(1500);nx=cur}
  use(nx);S.guard=false;me.querySelectorAll('.shield').forEach(x=>x.remove());P[cur].guard=false;
  draw();say('換 '+tag()+' 出招！');lock(false);
}
async function coopBossPhase(){
  if(S.poison&&S.boss>0){const pd=10;S.boss-=pd;draw();shake(boss);say(B.name+' 毒發了！受到 '+pd+' 點傷害！☠️');await wait(1200);if(S.boss<=0)return win()}
  const open=P.map((p,k)=>k).filter(k=>P[k].hp>0&&P[k].res!==1);
  if(S.bound){say(B.name+(typeof S.bound==='string'?S.bound:'被藤蔓纏住，動不了！🌿'));await wait(1300)}
  else if(!open.length){say('大家都成功了！'+B.name+'找不到機會攻擊！');await wait(1300)}
  else{use(open[Math.floor(Math.random()*open.length)]);await bossMove();stash();
    if(P[cur].hp<=0){P[cur].el.classList.add('faint');say(C.name+' 沒力氣了…隊友加油！');await wait(1400)}}
  stash();P.forEach(p=>{p.guard=false;p.el.querySelectorAll('.shield').forEach(x=>x.remove());p.done=false;p.res=null});S.guard=false;S.bound=false;
  if(P.every(p=>p.hp<=0))return lose();
  const nx=P.findIndex(p=>p.hp>0);use(nx);draw();say('新的回合！'+tag()+'，要用什麼招式？');lock(false);
}
async function bossMove(){
  if(B.photo&&S.boss<S.bossMax*0.4&&S.heals>0&&Math.random()<0.5){
    S.heals--;say(B.name+'使出了光合作用！🌞');await wait(500);
    boss.classList.add('blink');const h=rnd(14,20);S.boss=Math.min(S.bossMax,S.boss+h);draw();
    await wait(1000);boss.classList.remove('blink');say(B.name+'回復了 '+h+' 點體力！');await wait(1100);return;
  }
  const a=Math.random()<B.attacks[0].p?B.attacks[0]:B.attacks[1];
  say(B.name+'使出了'+a.name+'！'+a.em);await wait(500);
  if(S.fog&&Math.random()<.5){say(B.name+' 在毒霧裡看不清楚，攻擊打歪了！🫧');await wait(1300);return}
  await shoot(a.shot,boss,me);
  if(S.invis){const g=S.invis==='glide';S.invis=false;me.classList.remove('invis','glide');say(g?C.name+' 飛到天上，閃過了攻擊！🍃':'攻擊穿過了 '+C.name+'！完全打不到！👻');await wait(1400);return}
  boom(me,a.fx);shake(me);
  let d=Math.round(rnd(...a.dmg)*tier(SCALE)*(S.weak?.6:1)*(P[cur]&&P[cur].armor?.6:1));
  if(S.crystal>0){d=Math.ceil(d/5);S.crystal--;S.me-=d;draw();say('水晶保護擋住了！💎 '+C.name+' 只受到 '+d+' 點傷害！'+(S.crystal?'（還能再擋 1 次）':''));if(!S.crystal)me.classList.remove('crystal');await wait(1300);return}
  if(S.guard){d=Math.ceil(d/4);S.me-=d;draw();say('擋住了！🛡️ '+C.name+' 只受到 '+d+' 點傷害！')}
  else{S.me-=d;draw();say(C.name+' 受到 '+d+' 點傷害！')}
  await wait(1200);
  if(a.dizzy){S.dizzy=true;say(C.name+'被迷幻大法弄得頭暈暈的！下一回合會頭暈暈的！🌀');await wait(1600)}
  if(a.drain){const h=Math.min(d,S.bossMax-S.boss);if(h>0){S.boss+=h;draw();boss.classList.add('blink');
    say(B.name+'吸走了 '+h+' 點體力！🦇');await wait(1100);boss.classList.remove('blink')}}
}
let after=()=>reset();

sndLabel();$('snd').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('jiji-sound',soundOn?'on':'off')}catch(e){}sndLabel();if(soundOn)sfx('coin')};
